<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracking Lab — Khoa</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 48px auto;
      padding: 0 20px;
      line-height: 1.6;
      background: #f6f7fb;
      color: #172033;
    }
    article {
      background: white;
      padding: 24px;
      border-radius: 16px;
    }
  </style>
</head>
<body>
  <p><strong>DEMO học tracking — không bán hàng, không thu tiền.</strong></p>
  <h1>Shop demo của Khoa</h1>
  <article>
    <h2>Sổ tay demo</h2>
    <p>Mã sản phẩm: DEMO-NOTE-01</p>
    <p>Giá: <strong>100.000 VND</strong></p>
    <button type="button" id="add-to-cart">Thêm vào giỏ</button>
<button type="button" id="reset-cart">Xóa giỏ</button>

<p>Số lượng trong giỏ: <strong id="cart-quantity">0</strong></p>
<p>Tổng tiền: <strong id="cart-total">0 VND</strong></p>

<script>
  const price = 100000;
  let quantity = 0;

  function updateCart() {
    document.getElementById("cart-quantity").textContent = quantity;

    const total = price * quantity;
    document.getElementById("cart-total").textContent =
      total.toLocaleString("vi-VN") + " VND";
  }

  document.getElementById("add-to-cart").addEventListener("click", function () {
    quantity += 1;
    updateCart();
  });

  document.getElementById("reset-cart").addEventListener("click", function () {
    quantity = 0;
    updateCart();
  });
</script>
  </article>
</body>
</html>
